<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage TODO</title>

     <!-- bootstrap -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <div class="container my-5">
        <h1 id="heading">ADD TODO</h1>
        <form id="todolistform" action="" class="border p-4 w-75">
            <!-- title -->
             <div class="mb-3">
                <input id="titleinput" type="text" placeholder="title" class="form-control">
             </div>
             <div class="mb-3">
                <input id="dateinput" type="date" placeholder="Date" class="form-control">
             </div>
             <div class="mb-3">
                Status : 
                <label for="completed">Completed</label>
                <input type="checkbox" id="completed">
             </div>
             <div class="mb-3">
                <button type="submit" class="btn btn-success">Save</button>
                <button type="button" onclick="location.href='index.html'" class="btn btn-warning">Cancel</button>
             </div>
        </form>
    </div>
</body>
<script src="./todoform.js"></script>
</html>
